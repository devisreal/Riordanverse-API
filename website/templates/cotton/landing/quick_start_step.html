<c-vars number="" title="" description="" />
<article data-reveal
         class="quick-step flex min-w-0 flex-col rounded-3xl border border-border bg-subtle p-8 md:max-desktop:p-5 [&_.code-block]:rounded-2xl [&_.code-block]:p-4 [&_.code-block]:text-[10px] max-md:bg-surface max-md:p-5 max-md:[&_.code-block]:max-h-18.5 max-md:[&_.code-block]:rounded-full max-md:[&_.code-block]:p-3 max-md:first:[&_.step-footer]:hidden max-md:nth-2:[&_.step-footer]:hidden">
  <div class="step-top mb-6 flex items-center justify-between gap-3 max-md:mb-3"><span class="step-number inline-flex size-9 items-center justify-center rounded-full bg-button font-mono text-xs leading-[normal] font-bold text-button-text max-md:size-7 max-md:text-[10px]">{{ number }}</span>{{ badge }}</div>
  <h3 class="mb-1.5 text-lg leading-[1.6] max-md:mb-3 max-md:text-base">{{ title }}</h3>
  <p class="mb-5 text-xs leading-[1.65] max-md:mb-3">{{ description }}</p>
  {{ slot }}
  <div class="step-footer mt-auto pt-10 font-mono text-[10px] leading-[1.7] text-muted [&_a]:block [&_a]:font-bold [&_a]:text-heading [&_svg]:ml-1 [&_svg]:align-middle [&_a+a]:mt-1.5 max-md:pt-3">{{ footer }}</div>
</article>
