<button class="theme-toggle flex size-9 shrink-0 cursor-pointer items-center justify-center rounded-full border border-border bg-surface/70 text-text shadow-sm hover:bg-surface hover:text-heading active:scale-95 max-md:size-8 max-md:[&_svg]:size-4"
        type="button"
        data-theme-toggle
        aria-label="Switch theme"
        hidden>
  <span class="flex items-center justify-center"
        data-theme-icon="light"
        hidden>
    <c-icons.sun size="18" />
  </span>
  <span class="flex items-center justify-center"
        data-theme-icon="dark"
        hidden>
    <c-icons.moon size="18" />
  </span>
</button>
