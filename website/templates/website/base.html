{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Riordanverse API{% endblock title %}</title>
    <meta name="description" content="{{ social.description }}" />
    <link rel="canonical" href="{{ social.url }}" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{ social.title }}" />
    <meta property="og:title" content="{{ social.title }}" />
    <meta property="og:description" content="{{ social.description }}" />
    <meta property="og:url" content="{{ social.url }}" />
    <meta property="og:image" content="{{ social.image_url }}" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{ social.image_alt }}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ social.title }}" />
    <meta name="twitter:description" content="{{ social.description }}" />
    <meta name="twitter:image" content="{{ social.image_url }}" />
    <meta name="twitter:image:alt" content="{{ social.image_alt }}" />
    <link rel="icon"
          type="image/svg+xml"
          href="{% static 'website/images/favicon.svg' %}" />
    <script src="{% static 'website/js/theme.js' %}"></script>
    {% tailwind_css %}
    {% block extra_head %}
    {% endblock extra_head %}
  </head>
  <body class="website antialiased">
    <a class="skip-link fixed -top-25 left-4 z-100 rounded-xl bg-button px-5 py-3 text-button-text focus:top-3"
       href="#main-content">Skip to content</a>
    <div class="site-background pointer-events-none fixed inset-0 z-[-1] bg-(image:--background) bg-cover bg-center bg-no-repeat"
         aria-hidden="true"></div>
    {% block content %}
    {% endblock content %}
    <p class="sr-only" id="copy-status" role="status" aria-live="polite"></p>
    {% block extra_js %}
    {% endblock extra_js %}
  </body>
</html>
