version: 2
updates:
  # Python dependencies (uv / pyproject.toml)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    groups:
      django:
        patterns:
          - "django*"
      linting:
        patterns:
          - "ruff"
          - "pip-audit"
    labels:
      - "dependencies"
      - "python"

  # GitHub Actions themselves
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    labels:
      - "dependencies"
      - "github-actions"
