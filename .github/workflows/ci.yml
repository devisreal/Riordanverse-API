name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "chore/**"
      - "fix/**"
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: ci-only-dummy-secret-key-not-for-production
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: ci_db
      DB_USER: ci_user
      DB_PASSWORD: ci_password
      DB_HOST: localhost
      DB_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      API_KEY_CUSTOM_HEADER: HTTP_API_KEY

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Django system check
        run: uv run python manage.py check --settings=config.settings.test

      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run --settings=config.settings.test

      - name: Run tests
        run: uv run python manage.py test --settings=config.settings.test

  audit:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pip-audit
