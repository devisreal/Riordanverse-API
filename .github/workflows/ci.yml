name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "chore/**"
      - "fix/**"
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Django system check
        run: uv run python manage.py check --settings=config.settings.test

      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run --settings=config.settings.test

      - name: Run tests
        run: uv run python manage.py test --settings=config.settings.test
