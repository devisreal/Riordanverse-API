[dependency-groups]
dev = [
    "django-extensions>=4.1",
    "pip-audit>=2.10.1",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true
