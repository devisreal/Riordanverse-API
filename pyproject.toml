[project]
name = "percy-jackson-api"
version = "0.1.0"
description = "An unofficial Django REST API for Percy Jackson and Riordanverse reference data."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "certifi==2026.10.19",
    "colorlog>=6.12.0",
    "django==6.1.2",
    "django-autoslug>=1.9.9",
    "django-cors-headers==4.9.0",
    "django-cotton>=2.9.0,<3",
    "django-environ==0.14.0",
    "django-filter==26.2",
    "django-redis>=7.0.0",
    "django-tailwind>=4.6.0",
    "django-watson==1.6.3",
    "djangorestframework==3.18.3",
    "djangorestframework-api-key==3.1.0",
    "drf-spectacular==0.30.0",
    "gunicorn>=27.0.0",
    "psycopg2-binary==2.9.13",
    "pygments==2.21.0",
    "redis>=8.1.0",
    "tzdata==2026.5",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-extensions>=4.1",
    "django-tailwind[honcho]>=4.6.0",
    "djlint>=1.49.10",
    "pip-audit>=2.10.1",
    "requests==2.34.2",
    "ruff>=0.16.3",
    "ty>=0.0.73",
]

[tool.ruff]
line-length = 100
extend-exclude = ["API.md"]

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

[tool.djlint]
profile = "django"
indent = 2
max_line_length = 100
