    "django-environ==0.14.0",
    "django-filter==25.2",
    "django-multiselectfield==1.0.1",
    "django-redis>=7.0.0",
    "django-watson==1.6.3",
    "djangorestframework==3.17.1",
    "djangorestframework-api-key==3.1.0",
    "drf-spectacular==0.29.0",
    "idna==3.15",
    "inflection==0.5.1",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
