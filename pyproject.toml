    "markdown-it-py==4.2.0",
    "mdurl==0.1.2",
    "multidict==6.7.1",
    "packaging==26.2",
    "psycopg2-binary==2.9.12",
    "pygments==2.20.0",
    "pysocks==1.7.1",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
    "referencing==0.37.0",
    "requests==2.33.1",
    "requests-toolbelt==1.0.0",
    "rich==15.0.0",
    "rpds-py==2026.5.1",
    "setuptools==83.0.0",
    "sqlparse==0.5.5",
    "tzdata==2026.2",
    "uritemplate==4.2.0",
    "urllib3==2.7.0",
